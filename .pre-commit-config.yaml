# Install once per clone:  pip install pre-commit && pre-commit install
# gitleaks scans each commit for credentials before it lands in history. CI (.github/workflows/tests.yml) runs the
# same version over the whole history; bump both together.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
