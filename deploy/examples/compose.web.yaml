# Example only, not tested as written: adapt it to your own host. Names under example.org,
# the 192.0.2.x documentation address and everything in web.env are placeholders.
#
# The web app sits behind your TLS-terminating reverse proxy, in a DMZ. It never connects to a
# worker: workers connect to it. Run from this folder:
#   docker compose -f compose.web.yaml up -d --build
#
# web.env (not committed) holds the secrets, for example:
#   MAPCREATOR_WORKER_TOKEN=<python -c "import secrets; print(secrets.token_urlsafe(32))">
#   MAPCREATOR_IP_SALT=<another random value>
#   MAPCREATOR_TURNSTILE_SECRET=<from your Cloudflare Turnstile widget>
#   MAPCREATOR_TURNSTILE_SITE_KEY=<from the same widget>
name: mapcreator-web

services:
  web:
    build:
      context: ../..
      dockerfile: deploy/examples/Dockerfile.web
    image: mapcreator-web:local
    restart: unless-stopped
    env_file: web.env
    environment:
      MAPCREATOR_PUBLIC_URL: https://mapcreator.example.org
      MAPCREATOR_ROUTER: graphhopper
      MAPCREATOR_GRAPHHOPPER_URL: http://graphhopper:8989
      # Tracks live in an S3-compatible bucket (e.g. Cloudflare R2) served from a public custom domain.
      # The web app only builds URLs, so it holds no key: a key that can delete expired tracks could
      # also overwrite live downloads. The bucket's lifecycle rule (a few days past KEEP_DAYS) expires
      # them instead. To have the web app delete them itself, use MAPCREATOR_STORAGE: s3 with
      # MAPCREATOR_S3_ENDPOINT, MAPCREATOR_S3_BUCKET and a key in web.env.
      MAPCREATOR_STORAGE: public
      MAPCREATOR_DOWNLOAD_BASE: https://downloads.example.org
      # Retention: finished jobs and their downloads go after 30 days, client-IP hashes after 2.
      MAPCREATOR_KEEP_DAYS: "30"
      MAPCREATOR_IP_HASH_DAYS: "2"
      # Your reverse proxy's address as this container sees it, and the header the proxy
      # overwrites with the client's address. Anyone else's copy of that header is ignored.
      # A proxy on this host reaching the loopback-published port arrives from the edge network's
      # gateway, pinned below so it can't change on a recreate.
      MAPCREATOR_TRUSTED_PROXIES: 192.0.2.1
      MAPCREATOR_CLIENT_IP_HEADER: X-Forwarded-For
    volumes:
      - jobs:/var/lib/mapcreator
    ports:
      # Published on loopback only, for the reverse proxy on the same host.
      - "127.0.0.1:8000:8000"
    networks: [edge, routing]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Route previews: GraphHopper with a car profile (deploy/graphhopper). Import the graph first
  # (see deploy/graphhopper/README.md) into ./router-data/graph-car, a folder owned by uid 10001.
  graphhopper:
    build:
      context: ../graphhopper
    image: mapcreator-router:local
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xmx700m"
    volumes:
      # Writable: GraphHopper keeps a lock file beside the graph.
      - ./router-data:/data
    networks: [routing]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128

networks:
  edge:
    # A documentation range as the placeholder: pick a private /24 that's free on your host.
    ipam:
      config:
        - subnet: 192.0.2.0/24
          gateway: 192.0.2.1
  # Internal: GraphHopper needs no internet access once its graph is built.
  routing:
    internal: true

volumes:
  jobs: {}
