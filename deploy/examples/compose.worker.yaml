# Example only, not tested as written: adapt it to your own host. Names under example.org and
# everything in worker.env are placeholders.
#
# A build worker that accepts no connections and can reach nothing but an allowlist:
# - `worker` is only on `jobs`, an internal network with no route out.
# - `egress` (Squid) is on `jobs` and `outside`. It forwards HTTPS to the hosts listed in
#   egress-allowlist.txt and refuses private, loopback and link-local destinations
#   (squid.conf), even when an allowed name resolves to one.
# Run from this folder:
#   docker compose -f compose.worker.yaml up -d --build
#
# worker.env (not committed) holds the secret:
#   MAPCREATOR_WORKER_TOKEN=<the same token the web app has>
name: mapcreator-worker

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  worker:
    <<: *hardening
    build:
      context: ../..
      dockerfile: deploy/examples/Dockerfile.worker
    image: mapcreator-worker:local
    restart: unless-stopped
    env_file: worker.env
    environment:
      MAPCREATOR_API_BASE: https://mapcreator.example.org
      # Python (httpx) and GDAL's libcurl both read these.
      HTTPS_PROXY: http://egress:3128
      https_proxy: http://egress:3128
      GDAL_HTTP_PROXY: egress:3128
      NO_PROXY: ""
      # Finished tracks are uploaded to the same bucket the web app links to (write-only keys in .env).
      MAPCREATOR_STORAGE: s3
      MAPCREATOR_S3_ENDPOINT: https://<account id>.r2.cloudflarestorage.com
      MAPCREATOR_S3_BUCKET: mapcreator-tracks
      MAPCREATOR_DOWNLOAD_BASE: https://downloads.example.org
      # Roads (and buildings outside Tasmania) from the local OSM index, built elsewhere with
      # `python -m mapcreator.providers.osm.index build`. Overpass isn't on the egress allowlist.
      MAPCREATOR_OSM_INDEX: /osm/australia.sqlite
      # Local mirrors (scripts/mirror.py) are much faster than reading over HTTPS, and the canopy
      # model can only be read from a mirror:
      # MAPCREATOR_TAS_DEM: /mirror/Tasmania_Statewide_2m_DEM_14-08-2021.tif
      # MAPCREATOR_TAS_CHM: /mirror/CHM_2m/TAS_CHM_2m.tif
    user: "10001:10001"
    volumes:
      - cache:/cache
      # The folder holding australia.sqlite. Read-only: the index is opened immutable.
      - ./osm:/osm:ro
      # - <path to your DEM mirror>:/mirror:ro
    tmpfs:
      # Each job's work folder. Size it for your longest track.
      - /scratch:size=8g,uid=10001,gid=10001,mode=0700
    networks: [jobs]
    depends_on: [egress]
    mem_limit: 6g
    cpus: 2.0
    pids_limit: 256
    # The first SIGTERM lets the current build finish; give it time before the SIGKILL.
    stop_grace_period: 15m

  egress:
    <<: *hardening
    # Pin a tag or digest you have reviewed.
    image: ubuntu/squid:latest
    restart: unless-stopped
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
      - ./egress-allowlist.txt:/etc/squid/egress-allowlist.txt:ro
    tmpfs:
      # Owned by Squid's own user (uid 13 in ubuntu/squid), which writes them after dropping root.
      - /var/spool/squid:uid=13,gid=13
      - /var/log/squid:size=64m,uid=13,gid=13
      - /run
    # Squid starts as root and switches to its own user, so it needs these two back.
    cap_add: [SETUID, SETGID]
    networks: [jobs, outside]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

networks:
  jobs:
    internal: true
  outside: {}

volumes:
  cache: {}
