name: tests

# Every push and pull request: the whole test suite, including the check that nothing private is committed.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[service,s3,osm,dev]"
      - name: Test
        run: python -m pytest -q
