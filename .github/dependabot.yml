# Weekly pull requests for newer GitHub Actions (pinned to commit SHAs in the workflows), Python dependencies, and
# the Python base image the web app, worker and index builder are built on.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # The base image is pinned by digest on purpose (see the Dockerfiles): a new build of python:3.12-slim, with its
  # Debian and Python security fixes, arrives as a reviewable pull request instead of silently. Python 3.13 and later
  # are a deliberate move, so only digest updates within 3.12 are proposed.
  - package-ecosystem: docker
    directory: /deploy/examples
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
