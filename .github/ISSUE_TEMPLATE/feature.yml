name: Feature or idea
description: Something mapcreator could do, or a data source it could use.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: What it is, and what it would let you do.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data it would need
      description: >-
        If it needs a new data source, its name and a link to its licence. Tracks can only use data whose licence
        allows building and redistributing derived tracks (docs/data-sources.md).
