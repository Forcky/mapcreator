[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mapcreator"
version = "0.0.1"
description = "Generate Assetto Corsa tracks from real roads using open data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.4",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pillow>=11.2",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.9"]
# The hosted web front end and job API. Build workers need only the base package.
service = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8", "matplotlib>=3.9", "fastapi>=0.115"]

[project.scripts]
mapcreator = "mapcreator.cli.main:main"
mapcreator-web = "mapcreator.service.api:main"
mapcreator-worker = "mapcreator.service.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mapcreator.service" = ["static/*.html", "static/*.js", "static/*.css", "static/vendor/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs internet access to public data services (deselect with -m 'not network')",
]
addopts = "-m 'not network'"
